[project]
name = "__APP_NAME__"
version = "0.1.0"
description = "__TITLE__"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.7",
    "loguru>=0.7",
]

[project.scripts]
__APP_NAME__ = "__PKG__.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["__PKG__"]
